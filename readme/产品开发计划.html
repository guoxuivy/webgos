# 徽仓行招标内容及要求

## 第一部分 产品需求说明书（详细版）

### 文档信息

| 项目 | 内容 |
| --- | --- |
| 产品名称 | 徽仓行–安徽省仓网公共服务平台软件开发、数据采集与策划培训服务 |
| 版本 | V1.0 |
| 编制日期 | 2026年9月 |
| 建设单位 | 安徽省徽商现代供应链科技有限公司 |
| 开发周期 | 合同签约后10个月内 |

---

## 1. 项目背景与目标

### 1.1 项目背景

依托徽商集团省属国企公信力，整合全省工业及物流仓储资源，构建"行政+市场"双轮驱动的省级仓网公共服务平台，打造安徽省省级工业级物流空间数字底座。

### 1.2 建设目标

2026.11-2027.8：完成六大端（业主端、需求方端、中介端、平台管理端、政府端、徽仓行推广端）基础平台开发与测试上线，并在正式上线后达到累计上传有效面积 >= 3000万㎡，有效租赁园区数量不低于 650 个。

### 1.3 总体预算

**控标价：** 软件开发服务 + 数据采集服务 + 咨询策划与培训服务，总控标价上限为 **400 万元**。

**付款方式：**

| 阶段 | 付款条件与比例 |
| --- | --- |
| 第一阶段 | 签约合同后 5 个工作日内支付预付款，中标价的 **50%** |
| 第一阶段（续） | 数据采集规模及质量达要求并交付原始采集数据文件后支付 **20%** |
| 第二阶段 | 软件成功上线并完成数据上传后支付 **20%** |
| 第三阶段 | 咨询及培训服务完成后支付 **5%** |
| 第四阶段 | 质保期运营（1 年）满足正常运营后支付 **5%** |

- 上述服务需提供增值税专用发票，税率 **6%**。
- 上述付款需遵循先开票后付款为基本原则。

### 1.4 竞业限制

自合同签约后 3 年内不得在安徽省内为其他企业提供与本项目类似的软件开发服务。

### 1.5 五端定义与核心价值

| 端 | 角色 | 核心价值 |
| --- | --- | --- |
| 业主端（APP+网站） | 园区/资产持有方 | 实现资产物理硬件与经济价值的耦合衔接，对资产实施全生命周期管理。通过多渠道发布招商信息，构建与中介平台及中介机构的协同合作机制，在引入租户后提供覆盖全过程的租户服务管理，包括合同管理、租金收缴、财务处理及结算开票等环节。对中介机构实施全流程管理，涵盖结算管理及租金相关的法务合作管理。依托资产管理体系，全面提升物业管理水平与租户服务质量，最终实现面向业主视角的数据分析与决策支持。另外实现AI工具，对资产管理及财务数据可实现全面对话处理。 |
| 需求方端（APP+网站） | 企业租户/找仓方 | AI精准找仓、与业主端实现签约、合同管理，账单对账及缴费一站式管理，链接园区物业服务，链接徽仓行wms与tms端口，可实现账户数据互通 |
| 中介端（APP+网站） | 招商代理/经纪人 | 实现自主开拓的资产管理及代理资产管理，多渠道发布招商管理；对于多渠道来源的客户与需求进行分析管理，智能匹配供需选址与规划，对客户实现全过程跟进及成交与签约管理，对业主端发布的众包任务进行服务，提供线索及反馈，带看与成交，合同签约，佣金管理。自主创建选址代理及中介服务合同与模板，实现佣金等财务管理。团队管理。 |
| 平台管理端（网站） | 平台运营方 | 对所有平台入驻的企业进行认证审核，对所有端实现通知管理，对平台数据实现监督及分析管理，对saas用户进行开户及收费管理，对用户进行账户管理，平台录入资产数据服务，客服系统，系统设置 |
| 政府端（网站） | 政府机构方 | 产业数字地图、空置率/出租率动态数据分析、仓储价格指数、查询分析等，政策发布与管理 |
| 徽仓行推广端（网站+小程序） | 平台运营方 | 互联网推广园区资产，获客使用，与业主端和中介端及租户端实现数据链接使用，支持政府政策发布及广告发布 |

> **APP端开发要求：** 对网站功能端的业务流程结合使用场景进行优化功能模块场景进行设计开发，保持简洁、可用、好用为目标。

## 2. 五端业务架构

### 2.1 总体架构图（五端一体）

徽仓行超级服务平台基于统一技术底座和数据中台，面向五类核心用户提供差异化服务：

| 端 | 核心功能模块 |
| --- | --- |
| 业主端 | AI助手、资产管理、招商管理、合同管理、财务管理、租户管理、中介管理、物业管理、沟通管理、法务管理、数据分析、系统设置 |
| 需求方端 | AI助手、资产浏览、合同管理、账单异议、消息中心、工单服务、品牌设置、系统设置、中介沟通 |
| 中介端 | 团队管理、任务合作、资产管理、招商管理、众包合作、合同管理、财务管理、品牌设置、系统设置 |
| 平台管理端 | 认证审核，通知管理，数据分析，用户管理，资产管理，客服系统，系统设置 |
| 政府端 | 产业数字地图、仓储指数大屏、统计分析报表、政策管理 |

### 2.2 政府端详细功能设计

政府端为 PC Web 应用，无需移动端，面向省、市、县三级政府用户，支持角色分级权限（省级可看全省，市级仅看本市，县级仅看本县）。

| 功能模块 | 子功能 | 详细描述 |
| --- | --- | --- |
| 产业数字地图 | 全省仓储资源一张图 | 展示园区热力分布、空置率、租金水平、建筑类型 |
| 产业数字地图 | 多维度筛选 | 按城市、区域、面积段、租金区间、消防等级、土地性质等动态筛选 |
| 产业数字地图 | 时间轴回放 | 支持按年份查看历史空置率/租金变化趋势 |
| 仓储指数分析 | 核心指标看板 | 总挂牌面积、今日新增、空置率、平均租金、环比/同比变化 |
| 仓储指数分析 | 趋势图表 | 折线图/柱状图展示过去12个月走势，支持导出Excel/PDF |
| 统计分析报表 | 自动生成报告 | 每季度自动生成《安徽省仓储市场指数》 |
| 统计分析报表 | 自定义报表 | 自行选择维度（时间、区域、资产类型）生成交叉分析表 |
| 招商落地监管 | 重点项目跟踪 | 对接省/市重点招商项目库，展示项目进度、意向企业、签约状态 |
| 招商落地监管 | 企业画像查询 | 查看企业在省内已租赁的园区面积、合同周期、信用记录（脱敏） |
| 政策效果评估 | 补贴政策关联 | 将平台企业入驻数据与政府补贴发放数据关联，分析政策带动效应 |
| 预警中心 | 异常预警 | 空置率连续3月超阈值或租金异动超 +-10% 时自动推送预警 |

### 2.3 其他四端功能概述（详细版）

#### 2.3.1 业主端（Owner）

- **目标用户：** 园区持有方、资产管理公司、大型企业自持园区管理部门
- **核心价值：** 实现资产全生命周期数字化管理，提升招商效率，降低运营成本，增强租户服务能力。

**（1）徽仓行AI**

基于业主端系统的数据及底层模型，构建的智能助手，解答资产管理相关问题，包含查询，分析资产、招商、财务、合同、中介、工单等相关信息，便于相关领导快速查询数据使用。

**（2）资产管理模块**

| 子功能 | 详细说明 |
| --- | --- |
| 园区资产 | 创建/编辑园区基本信息（名称、地址、经纬度、占地面积、产权性质、土地用途、消防等级、环评资质等）；支持上传园区照片/视频；支持多级分类（按产业类型、建筑形态等）。可实现新建楼宇建筑信息及租赁信息分类录入功能，实现数字底座不变化，对租赁信息实行统一规划，有助于招商决策使用。 |
| 楼宇信息 | 对园区内每栋楼宇进行管理：楼号、楼层数、总建筑面积、标准层面积、建筑结构（钢结构/混凝土）、建设年代、电梯数量、卸货平台数量/尺寸、最大电力容量等。楼宇信息可实现修改，分建筑信息，租赁信息两个维度实现。按楼层、房间/库区粒度管理：房间编号、面积、层高、承重（kg/㎡）、柱距、地面材质（金刚砂/环氧/水泥）、是否带办公区、是否带行车/起重机等。记录园区配套设施：食堂（座位数/餐线）、宿舍（床位数/空调热水）、停车场（车位总数/新能源充电桩）、医务室、安保系统、门禁系统等。 |
| 土地管理 | 土地名称、土地面积、详细地址，地理位置定位（含红线绘制，大门绘制）、实现多维度的土地用途画像选择，对地块的条件实现属性，状态，年限，地面状况，建设需求，热度等选择，配套设施如用电，变压器，市政工程数据录入、合规资质文件、产权持有、相关现场照片等信息录入、上传照片/视频 |
| 标准单元商铺 | 商铺类型多维度选择、基本信息商铺名称，建筑面积，层高，停车位，装修状态，数据标注，详细地址，周边配套、工程条件如燃气接入、排烟等设置、动线可视评分选项、租金配置及租赁政策配置、上传照片/视频 |
| 标准单元办公 | 办公名称，编号，建筑面积，层高，楼层，楼层区域，建筑类型，租金报价，物业报价，地址，上传照片/视频等字段 |
| 标准单元仓库 | 仓库名称，编号，建筑面积，层高，楼层，楼层区域，建筑类型，租金报价，物业报价，消防等级、道路宽度，雨棚宽度、地址，上传照片/视频等字段 |
| 标准单元厂房 | 厂房名称，编号，建筑面积，层高，楼层，楼层区域，建筑类型，租金报价，物业报价，消防等级、道路宽度，雨棚宽度、地址，上传照片/视频等字段 |
| 设施设备 | 全面登记园区资产及维护信息及跟踪情况，可实现派单等功能 |
| 发布招商 | 选择园区楼栋楼层信息，基于底座数据发布租金及物业相关信息 |
| 多渠道发布管理 | 可实现对接仓小二对外出租网站平台，下载海报分享，微信公众号，官方网站 |

**（3）招商管理模块**

| 子功能 | 详细说明 |
| --- | --- |
| 线索客户 | 记录所有意向客户（来源：平台咨询、中介推荐、线下展会等），包括客户名称、联系人、电话、产业三级分类、企业角色、需求标签、状态、备注说明等 |
| 需求发布 | 基于线索客户发布租赁或出售相关信息，二级细分画像包含物流租售、生产租售、土地租售、办公租售、商业租售。每个需求包含数十种画像及标签分类，详细需求描述，便于未来AI数据分析和解决方案生成。 |
| 客户评估 | 包含前置否决、企业基本面、财务健康、租赁适配性、履约信用、社会价值多维度评估，数据可以实现手动录入或第三方平台接入数据 |
| 评估分析 | 对所有潜在租户企业分级评估模型数据分析，实现ABCD分类 |
| 客户跟进 | 对所有客户及需求进行跟进，实现首次跟进、产生意向、达成意向、尽职调查、签约合同、开具发票、全过程跟踪 |
| 名片推广 | 招商人员可根据自己所负责的项目建立详细的名片网页，对外发布分享名片及二维码，扫码可以查看所有负责的项目数据，获得推广引流，查看浏览人群数据及意向客户数据 |

**（4）合同管理模块**

| 子功能 | 详细说明 |
| --- | --- |
| 合同模板 | 支持多种合同模板（标准租赁合同、短期临租合同、续签合同等），可自定义条款（租金递增、免租期、违约金比例等）。 |
| 合同起草 | 选择租户、资产、租期、租金等参数，系统自动生成合同文本；支持在线编辑和版本比对。 |
| 审批流程 | 合同需经过部门经理、财务、法务等多级审批（可配置），审批通过后自动归档。 |
| 在线签约 | 对接电子签约服务商（法大大/上上签），租户通过手机或电脑完成实名认证和电子签名，签署后合同自动存储至云端。 |
| 合同列表 | 按状态（进行中/即将到期/已到期/已终止）分类展示所有合同；支持关键词搜索、按资产/租户筛选。 |
| 到期提醒 | 合同到期前30天、15天、7天、3天自动推送提醒给业主和租户（站内信+短信）。 |
| 合同变更 | 支持合同续签、租金调整、面积增减、提前解约等操作，变更记录全留存。 |
| 批量导入 | 支持Excel批量导入存量合同，减少初期录入工作量。 |

**（5）财务管理模块**

| 子功能 | 详细说明 |
| --- | --- |
| 账单管理 | 自动生成每月账单（租金+物业费+水电费+其他杂费），支持按合同条款自动计算递增租金；支持手动调整账单金额。 |

## 3. 数据采集服务

### 3.1 数据采集范围与指标

- **目标上传数据园区数量：** 不低于 650 个租赁类园区（以工业及物流地产为主），且覆盖建筑面积总计不低于 **3000万㎡**。
- **数据类型包括：**
  - 园区数字底座数据（名称、地址、经纬度、占地面积、建筑类型、消防等级、产权性质等）；
  - 建筑数据（每栋楼宇的层数、层高、承重、柱距、电梯/货梯配置、卸货平台等）；
  - 详细租赁数据（可租面积，租赁单价、当前部分租户名单、存储类型、客户类型、存货类型等）；
  - 无人机航拍鸟瞰图（每个园区至少1张高清航拍图）。

### 3.2 交付时间

合同签订后 **4个月内** 完成全部采集并入库。

### 3.3 企业规划咨询及培训服务

- **规划咨询：** 输出《徽仓行平台运营体系设计方案》《政府端数据服务产品化方案》《招商推广策略方案》，起草所有本系统相关的业务合同建议模板及业务推广PPT介绍。
- **培训服务：** 面向徽仓行运营团队培训 5 天；面向政府用户培训 3 场。

## 6. 产品功能开发先后顺序说明

### 6.1 排序原则

- **底座先行**：统一技术底座、数据中台、统一认证/权限、组织架构、字典与附件服务等公共能力必须先于业务功能完成，避免各端重复建设。
- **主链路优先**：优先打通"资产上架 → 招商获客 → 合同签约 → 账单收缴"核心业务闭环，确保最小可用业务链条尽早跑通。
- **供需闭环优先于增值功能**：AI 助手、深度数据分析、租金质押、风控等高阶能力后置，待核心数据积累后再开发。
- **先两端后多端**：以业主端、需求方端为第一批交付主体，中介端、平台管理端、政府端、推广端按里程碑分批上线。
- **高依赖与第三方对接前置预留**：电子签约（法大大/上上签）、短信、OCR、地图（天地图）、支付（微信/支付宝/云闪付）等外部接口需提前对接联调。

### 6.2 总体开发阶段与里程碑

| 阶段 | 时间（月） | 主要交付内容 | 里程碑 |
| --- | --- | --- | --- |
| 一、需求与设计 | M1–M2 | 需求细化、原型与交互设计、技术选型、数据库与接口设计 | 需求规格与设计评审通过 |
| 二、技术底座与数据中台 | M2–M3 | 统一认证/权限（RBAC）、数据中台、文件/字典/消息服务、CI/CD 与云环境 | 底座可运行、提供公共 API |
| 三、业主端核心 | M3–M6 | 资产管理、发布招商、线索/需求、合同、账单收款、租户与系统设置 | 业主端主链路可演示 |
| 四、需求方端 | M5–M7 | 智能搜索、地图找房、合同查看、账单缴费、发票申请 | 供需两侧闭环打通（内测版） |
| 五、中介端 | M6–M8 | 资产管理复用、众包/招商任务、佣金财务、业绩看板、模板 | 中介端上线 |
| 六、管理端 / 政府端 / 推广端 | M7–M9 | 认证审核、SaaS 租户管理、产业数字地图、仓储指数、推广展示 | 五端基础版就绪 |
| 七、智能化与增值模块 | M8–M10 | AI 助手、深度数据分析、法务管理、租金质押、风控 | 增值能力上线 |
| 八、联调测试与上线 | M9–M10 | 端到端联调、性能压测（1000 QPS / 50 并发地图）、等保与安全加固 | 验收上线 |

### 6.3 五端功能开发优先级

> **P0**：首批必须交付（主链路与底座依赖项）；**P1**：二期交付；**P2**：三期/增值功能。

### 6.4 关键功能依赖与前置关系

- 统一认证 / 权限 → 各端全部业务模块。
- 资产数字底座（园区/楼宇/标准单元）→ 发布招商 → 需求发布 → 智能匹配 → 合同签约。
- 合同管理 → 合同列表 / 到期提醒 → 账单生成 → 收款核销 → 发票开具 → 欠费催缴 / 法务管理。
- 数据采集与入库（数据中台）→ 政府端地图 / 仓储指数 / 数据分析。

### 6.5 交付节奏建议

1. **M3 首个可演示版本**：技术底座 + 业主端资产管理，验证数字底座建模能力。
2. **M6 内测版本**：业主端 + 需求方端主链路打通，可完成"发布—找仓—签约—缴费"闭环。
3. **M8 公测版本**：五端基础版就绪，中介端与管理端投入使用。
4. **M10 正式上线**：全功能交付验收，进入目标达成期（累计有效面积 >= 3000 万㎡、有效租赁园区 >= 650 个）。
5. **上线后迭代**：政府端、推广端与 AI / 数据分析能力持续优化，配合质保期运营。

    (function () {
      const src = document.getElementById('source').textContent;
      const raw = (window.marked && marked.parse) ? marked.parse(src) : src;
      const html = (window.DOMPurify) ? DOMPurify.sanitize(raw) : raw;
      const content = document.getElementById('content');
      content.innerHTML = html;

      // 生成目录 + 锚点
      const headings = [...content.querySelectorAll('h1, h2, h3, h4')];
      const tocList = document.getElementById('toc-list');
      headings.forEach((h, i) => {
        if (!h.id) h.id = 'h-' + i;
        const li = document.createElement('li');

        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.addEventListener('click', () => {
          history.replaceState(null, '', '#' + h.id);
        });
        li.appendChild(a);
        tocList.appendChild(li);
      });

      // 滚动高亮当前章节
      const tocLinks = [...tocList.querySelectorAll('a')];
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            const id = '#' + e.target.id;
            tocLinks.forEach((l) => l.classList.toggle('active', l.getAttribute('href') === id));
          }
        });
      }, { rootMargin: '-10% 0px -80% 0px' });
      headings.forEach((h) => observer.observe(h));

      // 返回顶部
      const back = document.getElementById('backtop');
      window.addEventListener('scroll', () => {
        back.style.display = window.scrollY > 400 ? 'block' : 'none';
      });
      back.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    })();
